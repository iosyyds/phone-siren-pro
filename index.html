<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>手机警报器 Pro · 网页版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080c12'/%3E%3Cpath d='M32 8 L56 50 H8 Z' fill='%23fbbf24'/%3E%3Crect x='29.5' y='24' width='5' height='14' rx='2.5' fill='%23080c12'/%3E%3Crect x='29.5' y='42' width='5' height='5' rx='2.5' fill='%23080c12'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#080c12; --panel:#10161f; --panel2:#131b27; --line:#1e2836;
  --text:#e7edf5; --muted:#8b99ac;
  --red:#f43f5e; --amber:#fbbf24; --yellow:#facc15; --green:#4ade80;
  --rose:#fb7185; --purple:#c084fc; --cyan:#22d3ee; --teal:#2dd4bf; --blue:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scrollbar-color:#2a3547 #0c1119}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;min-height:100vh;padding-bottom:60px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}

/* ===== 顶栏 ===== */
.top{position:sticky;top:0;z-index:50;background:rgba(8,12,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f43f5e,#7c3aed);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.top h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.top-stop{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.45);color:#fda4af;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;transition:.15s}
.top-stop:hover{background:rgba(244,63,94,.24)}
.top-stop:active{transform:scale(.96)}
.top-stop svg{width:13px;height:13px}

/* ===== 状态条 ===== */
.statusbar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px 12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.2s ease-in-out infinite;flex:none}
.statusbar.alarm .status-dot{background:var(--red);animation:blink .5s steps(1) infinite}
#statusText{font-size:13px;color:var(--muted)}
.flash-chip{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:.18s}
.flash-chip:hover{border-color:#33415a}
.flash-chip.on{color:var(--blue);border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.09)}
.flash-chip b{font-weight:600}
.ios-hint{display:none;max-width:560px;margin:-4px auto 0;padding:0 14px;font-size:12px;color:#66748a;align-items:center;gap:6px}
.ios-hint.show{display:flex}
.ios-hint svg{width:14px;height:14px;flex:none}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,.5)}50%{opacity:.65;box-shadow:0 0 0 4px rgba(74,222,128,0)}}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}

/* ===== 分区 ===== */
#app{max-width:560px;margin:0 auto;padding:0 14px}
section{margin-top:24px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-head .bar{width:4px;height:14px;border-radius:2px;background:var(--c);flex:none}
.sec-head h2{font-size:13px;font-weight:700;color:var(--c);letter-spacing:1.5px}
.sec-head .line{flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:430px){.grid.cols3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:480px){.grid.cols4{grid-template-columns:repeat(4,1fr)}}

/* ===== 按钮 ===== */
.btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 13px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s,transform .05s;min-width:0}
.btn:hover{border-color:#2c3a50}
.btn:active{transform:scale(.97)}
.btn .name{font-size:15px;font-weight:600;line-height:1.3}
.btn .desc{font-size:11px;color:var(--muted);line-height:1.4;white-space:normal}
.btn .wave{position:absolute;top:13px;right:12px;display:none;gap:2px;align-items:flex-end;height:13px}
.btn .wave span{width:3px;height:9px;border-radius:2px;background:var(--c);animation:eq .8s ease-in-out infinite}
.btn .wave span:nth-child(2){animation-delay:.14s}
.btn .wave span:nth-child(3){animation-delay:.28s}
.btn.active{background:color-mix(in srgb,var(--c) 12%,var(--panel2));border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 20px -6px var(--c)}
.btn.active .name{color:var(--c)}
.btn.active .wave{display:flex}
.btn.danger{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.1)}
.btn.danger .name{color:#fda4af}
.btn.danger.active{background:rgba(244,63,94,.22);border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 22px -6px var(--red)}
.btn.danger.active .name{color:#fff}
.hold{touch-action:none}
@keyframes eq{0%,100%{height:5px}50%{height:13px}}

/* ===== 警灯光效层 ===== */
#overlay{position:fixed;inset:0;z-index:95;pointer-events:none;opacity:0;transition:opacity .18s}
#overlay.on{opacity:1}
#overlay::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 50%,transparent 52%,rgba(0,0,0,.55));z-index:2}
#overlay .left,#overlay .right{position:absolute;top:0;bottom:0;width:50%;opacity:0}
#overlay .left{left:0;background:radial-gradient(130% 130% at 18% 50%,rgba(244,63,94,.8),rgba(244,63,94,.2) 55%,transparent 78%)}
#overlay .right{right:0;background:radial-gradient(130% 130% at 82% 50%,rgba(56,189,248,.8),rgba(56,189,248,.2) 55%,transparent 78%)}
.ov-patrol .left{animation:bl 2.4s steps(1,end) infinite}
.ov-patrol .right{animation:br 2.4s steps(1,end) infinite;animation-delay:1.2s}
.ov-response .left{animation:bl .9s steps(1,end) infinite}
.ov-response .right{animation:br .9s steps(1,end) infinite;animation-delay:.45s}
.ov-pursuit .left{animation:bl .26s steps(1,end) infinite}
.ov-pursuit .right{animation:br .26s steps(1,end) infinite;animation-delay:.13s}
.ov-steady .left,.ov-steady .right{opacity:.38}
.ov-rotate .left,.ov-rotate .right{display:none}
.ov-rotate{animation:rot 2s linear infinite}
.ov-flow .left,.ov-flow .right{display:none}
.ov-flow{background:repeating-linear-gradient(90deg,rgba(244,63,94,.45) 0 90px,rgba(56,189,248,.45) 90px 180px);background-size:360px 100%;animation:flow 1.1s linear infinite}
@keyframes bl{0%,49%{opacity:.95}50%,100%{opacity:.05}}
@keyframes br{0%,49%{opacity:.05}50%,100%{opacity:.95}}
@keyframes rot{0%,32%{background:rgba(244,63,94,.4)}33%,65%{background:rgba(56,189,248,.4)}66%,100%{background:rgba(228,238,248,.42)}}
@keyframes flow{to{background-position:-360px 0}}
@media (prefers-reduced-motion:reduce){
  .ov-patrol .left,.ov-patrol .right{animation-duration:5s}
  .ov-response .left,.ov-response .right{animation-duration:3s}
  .ov-pursuit .left,.ov-pursuit .right{animation-duration:2s}
  .ov-rotate{animation-duration:6s}
  .ov-flow{animation-duration:4s}
}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:#1b2533;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:86vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 设置面板 ===== */
#sheet{position:fixed;inset:0;background:rgba(2,5,9,.6);z-index:110;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheet-card{width:100%;max-width:560px;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:20px 20px calc(26px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;margin-bottom:18px}
.sheet-head h3{font-size:17px;font-weight:700}
.sheet-x{margin-left:auto;width:34px;height:34px;border-radius:10px;background:#1b2533;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.sheet-x:hover{color:var(--text)}
.set-row{margin-bottom:18px}
.set-row .lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.set-row label{font-size:14px;color:var(--text)}
.set-row .val{font-size:13px;color:var(--teal);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#243041;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--teal);border:3px solid #0c1119;box-shadow:0 0 0 1px var(--teal);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:3px solid #0c1119;box-shadow:0 0 0 1px var(--teal);cursor:pointer}
.switch{width:50px;height:29px;border-radius:999px;background:#243041;position:relative;transition:.2s;flex:none}
.switch::after{content:'';position:absolute;top:3.5px;left:3.5px;width:22px;height:22px;border-radius:50%;background:#8b99ac;transition:.2s}
.switch.on{background:rgba(45,212,191,.35)}
.switch.on::after{left:24.5px;background:var(--teal)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600}
.sheet-actions .ghost{background:#1b2533;color:var(--muted);border:1px solid var(--line)}
.sheet-actions .ghost:hover{color:var(--text)}
.sheet-actions .primary{background:var(--teal);color:#062019}
.sheet-actions .primary:active{transform:scale(.98)}
.sheet-note{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6}

/* ===== 页脚 ===== */
.foot{max-width:560px;margin:34px auto 0;padding:0 20px;font-size:11px;color:#5c6b80;line-height:1.8;text-align:center}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L21 19 H3 Z" fill="#fff" opacity=".92"/><rect x="11" y="9" width="2" height="5" rx="1" fill="#080c12"/><rect x="11" y="16" width="2" height="2" rx="1" fill="#080c12"/></svg>
    </div>
    <h1>手机警报器 Pro</h1>
    <button class="top-stop" id="topStop" title="一键全停">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      全停
    </button>
  </div>
</header>

<div class="statusbar" id="statusbar">
  <span class="status-dot" aria-hidden="true"></span>
  <span id="statusText">系统就绪</span>
  <button class="flash-chip" id="flashChip" role="switch" aria-checked="false">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    闪光灯联动 · <b id="flashChipTxt">已关闭</b>
  </button>
</div>
<p class="ios-hint" id="iosHint">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8 V5 a5 5 0 0 1 10 0 v3 M5 8 h14 v13 H5 Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13.5" r="2" fill="currentColor"/></svg>
  iPhone 请关闭侧边静音键
</p>

<main id="app"></main>

<footer class="foot">
  声音由 Web Audio 实时合成 · 浏览器无法调用手机闪光灯，警灯以屏幕光效模拟 · 广播喊话需要麦克风权限（建议佩戴耳机防回授）· 仅供娱乐演示，请勿在公共场合使用
</footer>

<div id="overlay" class="ov" aria-hidden="true"><div class="left"></div><div class="right"></div></div>

<div id="toast" role="status"></div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="调音设置">
  <div class="sheet-card">
    <div class="sheet-head"><h3>调音设置</h3><button class="sheet-x" id="sheetClose" aria-label="关闭">×</button></div>
    <div class="set-row">
      <div class="lab"><label for="vol">音量</label><span class="val" id="volVal">40%</span></div>
      <input type="range" id="vol" min="0" max="100" step="1" value="40">
    </div>
    <div class="set-row">
      <div class="lab"><label for="pitch">音调偏移（半音）</label><span class="val" id="pitchVal">0</span></div>
      <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
    </div>
    <div class="set-row">
      <div class="lab"><label for="vib">震动反馈</label></div>
      <button class="switch on" id="vib" role="switch" aria-checked="true" aria-label="震动反馈"></button>
    </div>
    <div class="sheet-actions">
      <button class="ghost" id="resetBtn">恢复默认</button>
      <button class="primary" id="sheetDone">完成</button>
    </div>
    <p class="sheet-note">音调偏移影响所有警报音的基准频率；震动反馈需要设备支持，仅作用于按键操作。</p>
  </div>
</div>

<script>
/* ================= 渲染 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const SECTIONS = [
  { id:'horn', title:'号角与广播', c:'#fbbf24', cols:2, btns:[
    { k:'horn', n:'汽笛号角', d:'点按触发' },
    { k:'broadcast', n:'广播喊话', d:'按住喊话 · 麦克风' }
  ]},
  { id:'lights', title:'战术警灯', c:'#f43f5e', cols:2, btns:[
    { k:'lauto', n:'自动联动', d:'随动' },
    { k:'lpatrol', n:'代码 1', d:'巡逻' },
    { k:'lresponse', n:'代码 2', d:'响应' },
    { k:'lpursuit', n:'代码 3', d:'追击' },
    { k:'lrotate', n:'大循环', d:'轮换' },
    { k:'lflow', n:'导流', d:'流水' },
    { k:'lsteady', n:'探照灯', d:'常亮' },
    { k:'lland', n:'全屏警灯', d:'横屏模式' }
  ]},
  { id:'manual', title:'手动电笛', c:'#facc15', cols:2, btns:[
    { k:'mhigh', n:'高音电笛', d:'长按爬升 / 松开滑落', hold:true },
    { k:'mlow', n:'低音电笛', d:'长按爬升 / 飞轮拖尾', hold:true }
  ]},
  { id:'cruise', title:'巡航与开道', c:'#4ade80', cols:3, btns:[
    { k:'wail', n:'巡航 Wail', d:'标准巡航' },
    { k:'escort', n:'特种开道', d:'低音冲锋 / 顶峰截断' },
    { k:'engineer', n:'工程抢险', d:'重型警示' }
  ]},
  { id:'urgent', title:'急促警报', c:'#fb7185', cols:3, btns:[
    { k:'yelp', n:'急促 Yelp', d:'急促' },
    { k:'pursuit', n:'追击变频', d:'追击' },
    { k:'extreme', n:'极速穿透', d:'极速' }
  ]},
  { id:'special', title:'特种与轮换', c:'#c084fc', cols:3, btns:[
    { k:'tremolo', n:'战术颤音', d:'高频颤音' },
    { k:'hilo', n:'救护 Hi-Lo', d:'救护双音' },
    { k:'auto', n:'自动', d:'随机轮换' }
  ]},
  { id:'dual', title:'双音并发', c:'#22d3ee', cols:2, btns:[
    { k:'dualA', n:'并发 A', d:'巡航 + 急促' },
    { k:'dualB', n:'并发 B', d:'急促 + 颤音' }
  ]},
  { id:'sys', title:'系统控制', c:'#2dd4bf', cols:4, btns:[
    { k:'bass', n:'重低音脉冲', d:'点击开启' },
    { k:'flash', n:'闪光灯联动', d:'已关闭' },
    { k:'settings', n:'系统设置', d:'调音设置' },
    { k:'stop', n:'静音', d:'一键全停', danger:true }
  ]}
];

const NAME = {
  horn:'汽笛号角', broadcast:'广播喊话', mhigh:'高音电笛', mlow:'低音电笛',
  wail:'巡航 Wail', escort:'特种开道', engineer:'工程抢险', yelp:'急促 Yelp',
  pursuit:'追击变频', extreme:'极速穿透', tremolo:'战术颤音', hilo:'救护 Hi-Lo',
  dualA:'并发 A · 巡航+急促', dualB:'并发 B · 急促+颤音', bass:'重低音脉冲'
};

function renderSections(){
  $('#app').innerHTML = SECTIONS.map(sec => `
  <section data-id="${sec.id}" style="--c:${sec.c}">
    <div class="sec-head"><span class="bar"></span><h2>${sec.title}</h2><span class="line"></span></div>
    <div class="grid${sec.cols >= 3 ? ' cols' + sec.cols : ''}">
      ${sec.btns.map(b => `
      <button class="btn${b.hold ? ' hold' : ''}${b.danger ? ' danger' : ''}" data-key="${b.k}" aria-pressed="false">
        <span class="wave" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="name">${b.n}</span>
        <span class="desc">${b.d}</span>
      </button>`).join('')}
    </div>
  </section>`).join('');
}

/* ================= 设置与音频 ================= */
let AC = null, master = null, comp = null;
const settings = { vol:.4, pitch:0, vibrate:true, flash:false, autoLight:false };
try{
  const saved = JSON.parse(localStorage.getItem('siren-pro-settings') || 'null');
  if(saved && typeof saved === 'object') Object.assign(settings, saved);
}catch(e){}

const pitchMul = () => Math.pow(2, settings.pitch / 12);

function ac(){
  if(!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    AC = new C();
    comp = AC.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 22; comp.ratio.value = 7; comp.attack.value = .004; comp.release.value = .22;
    master = AC.createGain();
    master.gain.value = settings.vol;
    master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}

function makeCurve(amount){
  const n = 1024, c = new Float32Array(n);
  for(let i = 0; i < n; i++){ const x = (i / n) * 2 - 1; c[i] = Math.tanh(x * amount); }
  return c;
}

function oscVoice(opts){
  const ctx = ac(), t = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = opts.type || 'sawtooth';
  osc.frequency.value = (opts.freq || 440) * pitchMul();
  const g = ctx.createGain();
  const rel = opts.release != null ? opts.release : .045;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(opts.gain || .4, t + (opts.attack != null ? opts.attack : .02));
  let prev = osc;
  if(opts.shaping){ const sh = ctx.createWaveShaper(); sh.curve = makeCurve(opts.shaping); prev.connect(sh); prev = sh; }
  if(opts.filter){
    const f = ctx.createBiquadFilter();
    f.type = opts.filter.type || 'lowpass';
    f.frequency.value = opts.filter.freq || 2000;
    if(opts.filter.q) f.Q.value = opts.filter.q;
    prev.connect(f); prev = f;
  }
  prev.connect(g); g.connect(master);
  if(opts.lfoFreq){
    const l = ctx.createOscillator(), lg = ctx.createGain();
    l.type = opts.lfoType || 'sine';
    l.frequency.value = opts.lfoFreq;
    lg.gain.value = (opts.lfoDepth || 0) * pitchMul();
    l.connect(lg); lg.connect(osc.frequency); l.start(t);
  }
  if(opts.ampLfo){
    const l = ctx.createOscillator(), lg = ctx.createGain(), base = ctx.createGain();
    l.frequency.value = opts.ampLfo;
    lg.gain.value = opts.ampLfoDepth || .4;
    base.gain.value = 1 - (opts.ampLfoDepth || .4);
    l.connect(lg); lg.connect(g.gain); base.connect(g.gain); l.start(t);
  }
  osc.start(t);
  return { osc, g, stop(){
    const t2 = ctx.currentTime;
    try{
      g.gain.cancelScheduledValues(t2);
      g.gain.setValueAtTime(Math.max(g.gain.value, .0001), t2);
      g.gain.linearRampToValueAtTime(0, t2 + rel);
      osc.stop(t2 + rel + .06);
    }catch(e){}
  }};
}

function manualHigh(){
  const ctx = ac(), t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'sawtooth';
  const f0 = 520 * pitchMul(); osc.frequency.value = f0;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .02);
  osc.connect(lp); lp.connect(g); g.connect(master); osc.start(t);
  const start = t;
  const iv = setInterval(() => {
    const held = ctx.currentTime - start;
    osc.frequency.setTargetAtTime(Math.min(f0 + held * 26, 1700 * pitchMul()), ctx.currentTime, .05);
  }, 60);
  return { stop(){
    clearInterval(iv);
    const t2 = ctx.currentTime;
    osc.frequency.setTargetAtTime(360 * pitchMul(), t2, .35);
    g.gain.setTargetAtTime(0, t2, .22);
    osc.stop(t2 + 1.3);
  }};
}

function manualLow(){
  const ctx = ac(), t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'sawtooth';
  const f0 = 320 * pitchMul(); osc.frequency.value = f0;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.48, t + .02);
  osc.connect(lp); lp.connect(g); g.connect(master); osc.start(t);
  const start = t;
  const iv = setInterval(() => {
    const held = ctx.currentTime - start;
    osc.frequency.setTargetAtTime(Math.min(f0 + held * 16, 950 * pitchMul()), ctx.currentTime, .06);
  }, 60);
  return { stop(){
    clearInterval(iv);
    const t2 = ctx.currentTime;
    osc.frequency.setTargetAtTime(62 * pitchMul(), t2, .6);
    g.gain.setTargetAtTime(0, t2, .5);
    osc.stop(t2 + 2.6);
  }};
}

function pursuitVoice(){
  const ctx = ac(), t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'sawtooth';
  let base = 850 * pitchMul(); osc.frequency.value = base;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.42, t + .02);
  osc.connect(lp); lp.connect(g); g.connect(master); osc.start(t);
  const l = ctx.createOscillator(), lg = ctx.createGain();
  l.frequency.value = 5; lg.gain.value = 470 * pitchMul();
  l.connect(lg); lg.connect(osc.frequency); l.start(t);
  const iv = setInterval(() => {
    base = Math.min(base + 6, 1250 * pitchMul());
    osc.frequency.setTargetAtTime(base, ctx.currentTime, .5);
  }, 700);
  return { stop(){
    clearInterval(iv);
    try{ l.stop(); }catch(e){}
    const t2 = ctx.currentTime;
    g.gain.cancelScheduledValues(t2);
    g.gain.setValueAtTime(Math.max(g.gain.value, .0001), t2);
    g.gain.linearRampToValueAtTime(0, t2 + .05);
    osc.stop(t2 + .12);
  }};
}

function autoVoice(){
  const pool = ['wail','yelp','pursuit','hilo','tremolo','engineer','extreme','escort'];
  let cur = null, curK = null;
  const pick = () => {
    if(cur){ try{ cur.stop(); }catch(e){} }
    curK = pool[(Math.random() * pool.length) | 0];
    cur = SIRENS[curK]();
    setName('随机轮换 · ' + NAME[curK]);
    if(settings.autoLight && settings.flash && LIGHT_MAP[curK]) setPattern(LIGHT_MAP[curK]);
    syncAll();
  };
  pick();
  const iv = setInterval(pick, 6000);
  return { stop(){
    clearInterval(iv);
    if(cur){ try{ cur.stop(); }catch(e){} }
    setName(null); syncAll();
  }};
}

const SIRENS = {
  horn(){ return oscVoice({ type:'sawtooth', freq:470, lfoFreq:5.2, lfoDepth:9, filter:{ type:'bandpass', freq:820, q:1.4 }, gain:.5, attack:.06, release:.09 }); },
  mhigh: manualHigh,
  mlow: manualLow,
  wail(){ return oscVoice({ freq:760, lfoFreq:.55, lfoDepth:370, filter:{ freq:1500 }, gain:.42 }); },
  escort(){ return oscVoice({ type:'sawtooth', freq:430, lfoFreq:1.1, lfoDepth:175, shaping:2.6, filter:{ freq:1000 }, gain:.45 }); },
  engineer(){ return oscVoice({ type:'square', freq:255, lfoFreq:1.5, lfoDepth:115, lfoType:'square', filter:{ freq:560 }, gain:.4 }); },
  yelp(){ return oscVoice({ freq:920, lfoFreq:3.4, lfoDepth:440, filter:{ freq:1800 }, gain:.42 }); },
  pursuit: pursuitVoice,
  extreme(){ return oscVoice({ freq:1350, lfoFreq:8.5, lfoDepth:560, filter:{ type:'highpass', freq:750 }, gain:.38 }); },
  tremolo(){ return oscVoice({ freq:1150, ampLfo:24, ampLfoDepth:.45, filter:{ freq:2300 }, gain:.4 }); },
  hilo(){ return oscVoice({ type:'sawtooth', freq:980, lfoFreq:1.7, lfoDepth:460, lfoType:'square', filter:{ freq:1700 }, gain:.42 }); },
  dualA(){ const a = SIRENS.wail(), b = SIRENS.yelp(); return { stop(){ a.stop(); b.stop(); } }; },
  dualB(){ const a = SIRENS.yelp(), b = SIRENS.tremolo(); return { stop(){ a.stop(); b.stop(); } }; },
  bass(){ return oscVoice({ type:'sine', freq:55, ampLfo:1.6, ampLfoDepth:.6, filter:{ type:'lowpass', freq:180 }, gain:.5 }); },
  auto: autoVoice
};

/* ================= 播放调度 ================= */
const voices = new Map();

function stopKey(k){
  const v = voices.get(k);
  if(v){ try{ v.stop(); }catch(e){} voices.delete(k); }
}

function stopAudio(){
  for(const v of [...voices.values()]){ try{ v.stop(); }catch(e){} }
  voices.clear(); setName(null); syncAll();
}

function play(key){
  stopAudio();
  const v = SIRENS[key]();
  if(!v) return;
  voices.set(key, v);
  if(settings.autoLight && settings.flash && LIGHT_MAP[key]) setPattern(LIGHT_MAP[key]);
  setName(NAME[key]);
  syncAll(); checkIOS();
}

async function holdStart(key){
  if(key === 'broadcast'){
    if(!await broadcastStart()) return;
    voices.set('hold:broadcast', { stop: broadcastStop });
    setName('广播喊话'); syncAll(); return;
  }
  stopAudio();
  const v = SIRENS[key]();
  if(!v) return;
  voices.set('hold:' + key, v);
  if(settings.autoLight && settings.flash && LIGHT_MAP[key]) setPattern(LIGHT_MAP[key]);
  setName(NAME[key]);
  syncAll(); checkIOS();
}

function holdEnd(key){ stopKey('hold:' + key); setName(null); syncAll(); }

function allStop(){
  stopAudio();
  setPattern(null);
  broadcastStop();
  vibrate(20);
  toast('已全部停止');
}

/* ================= 广播喊话（麦克风） ================= */
let micStream = null, micSrc = null, micGain = null;
async function broadcastStart(){
  try{
    if(!micStream){
      micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    }
    const ctx = ac();
    micSrc = ctx.createMediaStreamSource(micStream);
    micGain = ctx.createGain(); micGain.gain.value = .85;
    micSrc.connect(micGain); micGain.connect(master);
    return true;
  }catch(e){ toast('未获得麦克风权限，无法喊话'); return false; }
}
function broadcastStop(){
  try{
    if(micSrc){ micSrc.disconnect(); micSrc = null; }
    if(micGain){ micGain.disconnect(); micGain = null; }
    if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }catch(e){}
}

/* ================= 警灯光效 ================= */
let pattern = null;
const LIGHT_BTN = { lpatrol:'patrol', lresponse:'response', lpursuit:'pursuit', lrotate:'rotate', lflow:'flow', lsteady:'steady' };
const LIGHT_MAP = {
  horn:'steady', wail:'patrol', escort:'steady', engineer:'rotate', yelp:'response',
  pursuit:'pursuit', extreme:'pursuit', tremolo:'flow', hilo:'rotate',
  dualA:'response', dualB:'flow', bass:'rotate', mhigh:'rotate', mlow:'rotate'
};
const OVERLAY = $('#overlay');

function setPattern(p){
  pattern = p || null;
  OVERLAY.className = pattern ? 'ov on ov-' + pattern : 'ov';
  syncAll();
}

function toggleLight(k){
  if(!settings.flash){ toast('请先开启「闪光灯联动」'); return; }
  const p = LIGHT_BTN[k];
  if(p) setPattern(pattern === p ? null : p);
}
function toggleAutoLight(){
  if(!settings.flash){ toast('请先开启「闪光灯联动」'); return; }
  settings.autoLight = !settings.autoLight;
  toast(settings.autoLight ? '自动联动已开启 · 灯效随警报切换' : '自动联动已关闭');
  save(); syncAll();
}
function toggleFlash(){
  settings.flash = !settings.flash;
  if(!settings.flash){ settings.autoLight = false; setPattern(null); }
  toast('闪光灯联动' + (settings.flash ? '已开启' : '已关闭'));
  save(); syncAll();
}
function toggleLandscape(){
  if(!settings.flash){ toast('请先开启「闪光灯联动」'); return; }
  if(document.fullscreenElement){
    document.exitFullscreen().catch(() => {});
  }else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen()
      .then(() => { setPattern('steady'); toast('横屏警灯模式'); })
      .catch(() => toast('当前浏览器不支持全屏'));
  }else{
    toast('当前浏览器不支持全屏');
  }
}

/* ================= 状态与界面 ================= */
function setName(n){
  $('#statusText').textContent = n || '系统就绪';
  $('#statusbar').classList.toggle('alarm', !!n);
}

function vibrate(ms){ if(settings.vibrate && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function syncAll(){
  $$('.btn').forEach(b => {
    const k = b.dataset.key;
    let on = false;
    if(k === 'lauto') on = settings.autoLight;
    else if(k === 'flash') on = settings.flash;
    else if(k === 'lland') on = !!document.fullscreenElement;
    else if(LIGHT_BTN[k]) on = pattern === LIGHT_BTN[k];
    else on = voices.has(k) || voices.has('hold:' + k);
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  const t = settings.flash ? '已开启' : '已关闭';
  $('#flashChipTxt').textContent = t;
  $('#flashChip').classList.toggle('on', settings.flash);
  $('#flashChip').setAttribute('aria-checked', settings.flash);
  const fb = document.querySelector('[data-key="flash"] .desc');
  if(fb) fb.textContent = t;
}

/* ================= iOS 静音键提示 ================= */
let iosChecked = false;
function checkIOS(){
  if(iosChecked || !AC || !master) return;
  if(!/iPhone|iPad/i.test(navigator.userAgent)) return;
  iosChecked = true;
  const an = AC.createAnalyser(); an.fftSize = 256;
  master.connect(an);
  const d = new Uint8Array(an.fftSize);
  setTimeout(() => {
    try{
      an.getByteFrequencyData(d);
      let s = 0; for(const x of d) s += x;
      if(s === 0) $('#iosHint').classList.add('show');
      an.disconnect();
    }catch(e){}
  }, 600);
}

/* ================= 设置面板 ================= */
const sheet = $('#sheet');
function openSheet(){ sheet.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); }

function save(){
  try{ localStorage.setItem('siren-pro-settings', JSON.stringify({ vol:settings.vol, pitch:settings.pitch, vibrate:settings.vibrate, flash:settings.flash, autoLight:settings.autoLight })); }catch(e){}
}

/* ================= 事件绑定 ================= */
let lastPointerUpAt = 0;
function bindHold(btn, key){
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    lastPointerUpAt = 0;
    vibrate(18); holdStart(key);
  });
  const up = () => { lastPointerUpAt = Date.now(); holdEnd(key); };
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', () => {
    if(Date.now() - lastPointerUpAt < 600) return;
    holdStart(key);
    setTimeout(() => holdEnd(key), 400);
  });
}

function wire(){
  $$('.btn').forEach(b => {
    const k = b.dataset.key;
    if(b.classList.contains('hold')){ bindHold(b, k); return; }
    b.addEventListener('click', () => {
      if(k === 'stop'){ vibrate(20); allStop(); return; }
      if(k === 'flash'){ toggleFlash(); return; }
      if(k === 'settings'){ openSheet(); return; }
      if(k === 'lauto'){ toggleAutoLight(); return; }
      if(k === 'lland'){ toggleLandscape(); return; }
      if(LIGHT_BTN[k]){ vibrate(12); toggleLight(k); return; }
      if(voices.has(k)){ stopKey(k); setName(null); syncAll(); return; }
      vibrate(20); play(k);
    });
  });
  $('#topStop').addEventListener('click', allStop);
  $('#flashChip').addEventListener('click', toggleFlash);
  document.addEventListener('fullscreenchange', syncAll);

  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetDone').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });
  $('#vol').addEventListener('input', e => {
    settings.vol = e.target.value / 100;
    $('#volVal').textContent = Math.round(e.target.value) + '%';
    if(master && AC) master.gain.setTargetAtTime(settings.vol, AC.currentTime, .02);
    save();
  });
  $('#pitch').addEventListener('input', e => {
    settings.pitch = +e.target.value;
    $('#pitchVal').textContent = (settings.pitch > 0 ? '+' : '') + settings.pitch;
    save();
  });
  $('#vib').addEventListener('click', () => {
    settings.vibrate = !settings.vibrate;
    $('#vib').classList.toggle('on', settings.vibrate);
    $('#vib').setAttribute('aria-checked', settings.vibrate);
    save();
  });
  $('#resetBtn').addEventListener('click', () => {
    settings.vol = .4; settings.pitch = 0; settings.vibrate = true;
    $('#vol').value = 40; $('#volVal').textContent = '40%';
    $('#pitch').value = 0; $('#pitchVal').textContent = '0';
    $('#vib').classList.add('on'); $('#vib').setAttribute('aria-checked', 'true');
    if(master && AC) master.gain.setTargetAtTime(.4, AC.currentTime, .02);
    save();
  });
}

/* ================= 启动 ================= */
renderSections();
wire();
syncAll();
</script>
